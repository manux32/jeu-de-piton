<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% is the configured Vite base, so these resolve under the Pages
         sub-path. apple-touch-icon + the web-app meta give iOS a proper icon and
         a chromeless, fullscreen launch from the home screen. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1330" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piton" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jeu de piton</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
