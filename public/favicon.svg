<!-- jeu-de-piton app/favicon mark: the four player-colour nests in a diamond
     around a central die — the whole game read at a glance. Palette tracks
     PLAYER_HEX / DIE_FACE_FILL in src/ui/theme.ts. Authored at a 512 viewBox so
     it doubles as the source the PWA icons are rasterised from (scripts/make-icons.mjs);
     content is kept inside the maskable safe zone (~205px radius from centre). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1c1330"/>
  <!-- nests, clockwise from top: red, blue, yellow, green (PLAYER_HEX) -->
  <circle cx="256" cy="116" r="56" fill="#d24b40"/>
  <circle cx="396" cy="256" r="56" fill="#3d6fd0"/>
  <circle cx="256" cy="396" r="56" fill="#e0a81e"/>
  <circle cx="116" cy="256" r="56" fill="#3a9d4a"/>
  <!-- central die, 5-face -->
  <rect x="186" y="186" width="140" height="140" rx="26" fill="#fdfcf8"/>
  <g fill="#1c1330">
    <circle cx="220" cy="220" r="13"/>
    <circle cx="292" cy="220" r="13"/>
    <circle cx="256" cy="256" r="13"/>
    <circle cx="220" cy="292" r="13"/>
    <circle cx="292" cy="292" r="13"/>
  </g>
</svg>
